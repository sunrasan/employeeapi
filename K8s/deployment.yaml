apiVersion: apps/v1
kind: Deployment

metadata:
  name: employeeapi
  namespace: employee

  labels:
    app: employeeapi

spec:
  replicas: 1

  strategy:
    type: RollingUpdate

  selector:
    matchLabels:
      app: employeeapi

  template:
    metadata:
      labels:
        app: employeeapi

    spec:
      containers:

        - name: employeeapi

          image: <AWS_ACCOUNT_ID>.dkr.ecr.ap-south-1.amazonaws.com/employeeapi:1.0

          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
