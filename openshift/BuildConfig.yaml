apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  annotations:
    app.openshift.io/vcs-ref: ""
    app.openshift.io/vcs-uri: https://github.com/sunrasan/employeeapi
    openshift.io/generated-by: OpenShiftWebConsole
  labels:
    app: employeeapi
    app.kubernetes.io/component: employeeapi
    app.kubernetes.io/instance: employeeapi
    app.kubernetes.io/name: employeeapi
    app.kubernetes.io/part-of: primer-export
  name: employeeapi
spec:
  failedBuildsHistoryLimit: 5
  nodeSelector: null
  output:
    to:
      kind: ImageStreamTag
      name: employeeapi:latest
  postCommit: {}
  resources: {}
  runPolicy: Serial
  source:
    contextDir: /
    git:
      uri: https://github.com/sunrasan/employeeapi
    type: Git
  strategy:
    dockerStrategy:
      dockerfilePath: Dockerfile
    type: Docker
  successfulBuildsHistoryLimit: 5
  triggers:
  - generic:
      secretReference:
        name: employeeapi-generic-webhook-secret
    type: Generic
  - github:
      secretReference:
        name: employeeapi-github-webhook-secret
    type: GitHub
  - type: ConfigChange
